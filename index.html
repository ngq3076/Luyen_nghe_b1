/* Layout: sticky control bar on top, one scannable list of word rows below, each with its own play buttons */
:root{--bg:#f3f6f7;--surface:#fff;--fg:#17262b;--muted:#5d7178;--line:#d8e1e4;--accent:#0b7a75;--accent-fg:#fff;--accent-soft:#dff1ef;--warn:#9a5b00;

:root[data-theme="dark"]{--bg:#10191c;--surface:#172328;--fg:#e6eff1;--muted:#93a8ae;--line:#27383d;--accent:#4fd1c5;--accent-fg:#06201e;--accent-soft:#17343a;--warn:#f0b35a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 32px}
.wrap{max-width:860px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:14px 10px;z-index:2;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-size:1.5rem;margin:0 0 8px;text-wrap:balance}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.ctl>*{min-width:0}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
#q{flex:1 1 180px}
label.s{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.9rem}
input[type=range]{padding:0;width:90px}
.meta{color:var(--muted);font-size:.9rem;margin-top:8px}
.msg{color:var(--warn);font-size:.9rem;margin-top:6px}
ul{list-style:none;margin:12px 0;padding:0;display:grid;gap:8px}
li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.pl{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:1rem;cursor:pointer;flex:none}
.pl.s{width:32px;height:32px;background:var(--accent-soft);color:var(--accent);font-size:.8rem}
.pl.on{outline:3px solid var(--accent-soft);outline-offset:2px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.w{font-family:var(--display);font-size:1.2rem;font-weight:700;overflow-wrap:anywhere}
.t{color:var(--muted);font-size:.85rem}
.ipa{color:var(--accent);font-variant-numeric:tabular-nums}
.vi{font-weight:600}
.ex{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.ex div{min-width:0}.ex em{font-style:normal;color:var(--muted);display:block;font-size:.9rem}
#more{display:block;margin:0 auto;padding:10px 20px;border-radius:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
</style>

let shown=60,cur=[],playing=null;
const wk=$("wk");wk.innerHTML='<option value="">Cả 12 chủ đề</option>'+D.topics.map(t=>`<option value="${t[0]}">Tuần ${t[0]} · ${t[1]}</option>`).join("");
try{const s=JSON.parse(localStorage.getItem("b1speak")||"{}");if(s.acc)$("acc").value=s.acc;if(s.rate)$("rate").value=s.rate}catch(e){}
function save(){try{localStorage.setItem("b1speak",JSON.stringify({acc:$("acc").value,rate:$("rate").value}))}catch(e){}}
const syn=window.speechSynthesis;let voices=[];
function load(){voices=syn?syn.getVoices():[];const m=$("msg");if(!syn){m.hidden=false;m.textContent="Trình duyệt này không hỗ trợ đọc. Hãy mở bằng Chrome, Edge hoặc Safari."}else if(voices.length&&!voices.some(v=>v.lang.startsWith("en"))){m.hidden=false;m.textContent="Máy chưa có giọng tiếng Anh. Hãy cài giọng English trong cài đặt hệ thống."}else m.hidden=true}
if(syn){load();syn.onvoiceschanged=load}
function say(text,btn){
 if(!syn)return;syn.cancel();document.querySelectorAll(".pl.on").forEach(b=>b.classList.remove("on"));
 if(playing===btn){playing=null;return}
 const u=new SpeechSynthesisUtterance(text.replace("★ ",""));const lang=$("acc").value;u.lang=lang;u.rate=+$("rate").value;
 const v=voices.find(v=>v.lang.replace("_","-")===lang)||voices.find(v=>v.lang.startsWith("en"));if(v)u.voice=v;
 btn.classList.add("on");playing=btn;u.onend=u.onerror=()=>{btn.classList.remove("on");if(playing===btn)playing=null};syn.speak(u)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function filter(){const q=$("q").value.trim().toLowerCase(),w=wk.value,t=$("tier").value;
 cur=D.rows.filter(r=>(!w||r[7]==w)&&(!t||r[6]==t)&&(!q||r[0].toLowerCase().includes(q)||r[3].toLowerCase().includes(q)));shown=60;render()}
function render(){const L=$("list");L.innerHTML=cur.slice(0,shown).map((r,i)=>`<li><button class="pl" data-s="${esc(r[0])}" aria-label="Nghe ${esc(r[0])}">▶</button><div><div class="w">${esc(r[0])}</div><div class="t">${esc(r[1])} · <span class="ipa">${esc(r[2])}</span> · ${esc(r[6])} · Tuần ${r[7]}</div><div class="vi">${esc(r[3])}</div></div><div class="ex"><button class="pl s" data-s="${esc(r[4])}" aria-label="Nghe câu ví dụ">▶</button><div>${esc(r[4])}<em>${esc(r[5])}</em></div></div></li>`).join("");
 $("meta").textContent=cur.length+" từ"+(cur.length>shown?" · đang hiện "+shown:"");$("more").hidden=cur.length<=shown}
$("list").addEventListener("click",e=>{const b=e.target.closest("button.pl");if(b)say(b.dataset.s,b)});
$("more").onclick=()=>{shown+=60;render()};
["q","wk","tier"].forEach(i=>$(i).addEventListener("input",filter));$("acc").onchange=save;$("rate").onchange=save;
filter();
